services:
  client:
    image: client
    build:
      context: ./client/
      dockerfile: Dockerfile.client
    init: true
    # environment: these didnt worked to auto refresh on file change for the frontend
    #   - CHOKIDAR_USEPOLLING=true
    #   - VITE_DEBUG=true
    volumes:
      - type: bind
        source: ./client/
        target: /usr/src/app/
      - type: volume
        target: /usr/src/app/node_modules
    networks:
      - frontend
    ports:
      - 3000:3000

  api-gateway:
    build:
      context: ./server/
      dockerfile: /apps/api-gateway/Dockerfile
    environment:
    - CHOKIDAR_USEPOLLING=true
    - CHOKIDAR_INTERVAL=100
    volumes:
      - type: bind
        source: ./server/apps/api-gateway
        target: /usr/src/app/apps/api-gateway
      - type: volume
        target: /usr/src/app/node_modules
    # - type: volume
    #   target: /usr/src/app/dist
    networks:
      - frontend
      - backend
    ports:
      - "8080:8080"

  auth-service:
    build:
      context: ./server/
      dockerfile: /apps/auth-service/Dockerfile
    environment:
    - CHOKIDAR_USEPOLLING=true
    - CHOKIDAR_INTERVAL=100
    volumes:
      - type: bind
        source: ./server/
        target: /usr/src/app/
      - type: volume
        target: /usr/src/app/node_modules
    # - type: volume
    #   target: /usr/src/app/dist
    networks:
      - backend
    ports:
      - "6001:6001"

  # user-service:
  #   build:
  #     context: .
  #     dockerfile: ./server/apps/user-service/Dockerfile
  #   volumes:
  #     - type: bind
  #       source: ./server/
  #       target: /usr/src/app/
  #     - type: volume
  #       target: /usr/src/app/node_modules
  #     - type: volume
  #       target: /usr/src/app/dist
  #   ports:
  #     - "6002:6002"

  pathly-redis:
    image: redis:7-alpine
    container_name: pathly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    restart: always
    command: redis-server --appendonly yes --requirepass "Admin@1234"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Admin@1234", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  pathly-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pathly-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: Admin@1234
      RABBITMQ_DEFAULT_VHOST: pathly
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: pathly-redis-insight
    ports:
      - "5540:5540"
    networks:
      - backend
    depends_on:
      pathly-redis:
        condition: service_healthy
    restart: always
  # put pathly-redis:6379 as the redis url in redisinsight as inside docker localhost refers to the container itself

  # Monitoring Stack
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    networks:
      - backend
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"  # Changed port to avoid conflict with React app
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - backend
    depends_on:
      - prometheus

volumes:
  redis-data:
  rabbitmq-data:
  grafana-storage:
  prometheus-storage:

networks:
  frontend:
  backend:
